<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 372" width="280" height="372">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a193b"/>
      <stop offset="50%" stop-color="#0f2552"/>
      <stop offset="100%" stop-color="#050e24"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9dcff"/>
      <stop offset="100%" stop-color="#7ea2e6"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="280" height="372" fill="url(#bgGrad)"/>
  
  <!-- Subtle border & glow -->
  <rect x="1" y="1" width="278" height="370" rx="10" fill="none" stroke="rgba(157, 184, 232, 0.3)" stroke-width="2"/>
  
  <!-- Stylized geometric piano & musical motif -->
  <g transform="translate(140, 140)">
    <!-- Outer decorative circle -->
    <circle r="75" fill="none" stroke="rgba(157, 184, 232, 0.2)" stroke-width="2" stroke-dasharray="4 4"/>
    <circle r="65" fill="rgba(15, 37, 82, 0.7)" stroke="rgba(157, 184, 232, 0.4)" stroke-width="2"/>
    
    <!-- Stylized Piano Keys Graphic -->
    <g transform="translate(-40, -35)">
      <!-- White Keys -->
      <rect x="0" y="0" width="16" height="70" rx="3" fill="#e2edff"/>
      <rect x="16" y="0" width="16" height="70" rx="3" fill="#e2edff"/>
      <rect x="32" y="0" width="16" height="70" rx="3" fill="#e2edff"/>
      <rect x="48" y="0" width="16" height="70" rx="3" fill="#e2edff"/>
      <rect x="64" y="0" width="16" height="70" rx="3" fill="#e2edff"/>
      
      <!-- Key Dividers -->
      <line x1="16" y1="0" x2="16" y2="70" stroke="#0a193b" stroke-width="1.5"/>
      <line x1="32" y1="0" x2="32" y2="70" stroke="#0a193b" stroke-width="1.5"/>
      <line x1="48" y1="0" x2="48" y2="70" stroke="#0a193b" stroke-width="1.5"/>
      <line x1="64" y1="0" x2="64" y2="70" stroke="#0a193b" stroke-width="1.5"/>
      
      <!-- Black Keys -->
      <rect x="11" y="0" width="10" height="42" rx="2" fill="#070f24"/>
      <rect x="27" y="0" width="10" height="42" rx="2" fill="#070f24"/>
      <rect x="59" y="0" width="10" height="42" rx="2" fill="#070f24"/>
    </g>
  </g>
  
  <!-- Text: Name & Role -->
  <text x="140" y="270" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, serif" font-size="24" font-weight="700" fill="url(#goldGrad)" letter-spacing="2">YOGURT</text>
  <text x="140" y="302" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#9db8e8" letter-spacing="4">PIANO · 12 YRS</text>
  <text x="140" y="325" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="rgba(157, 184, 232, 0.6)" letter-spacing="1.5">1ST GENERATION MEMBER</text>
</svg>
